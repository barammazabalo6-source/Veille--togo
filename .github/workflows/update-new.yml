name: Mise à jour quotidienne des actus Togo

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer les actus
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node fetch-news.js

      - name: Sauvegarder les changements
        run: |
          git config user.name "veille-bot"
          git config user.email "bot@veille.local"
          git add data.json
          git diff --staged --quiet || git commit -m "Mise à jour automatique des actus"
          git push
